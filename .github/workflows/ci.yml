name: PortFootprint CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'

    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy bandit

    - name: Check Formatting & Lint with Ruff
      run: ruff check .

    - name: Run Strict Type Checks with MyPy
      run: mypy portfootprint/

    - name: Run Security Scans with Bandit
      run: bandit -r portfootprint/

  build-and-test:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: static-analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Development dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Test Suite with Pytest & Coverage
      run: |
        python -m pytest --cov=portfootprint --cov-report=term-missing tests/

    - name: Verify Package Build
      run: |
        pip install build
        python -m build
